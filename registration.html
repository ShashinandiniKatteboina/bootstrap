<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Registration Form</h2>
</div>
<form class="needs-validation" novalidate>
    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="Enter your name" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" class="form-control" placeholder="Enter your roll number" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="Enter your email" required>
        <div class="invalid-feedback">Please enter a valid email address.</div>
    </div>
    <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <div class="input-group">
            <span class="input-group-text">+91</span>
            <input type="tel" class="form-control" placeholder="Enter your mobile number" maxlength="10" required>
            <div class="invalid-feedback">Please enter a valid mobile number.</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label d-block">Gender</label>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="male" required>
            <label class="form-check-label" for="male">Male</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="female"  required>
            <label class="form-check-label" for="female">Female</label>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Branch</label>
        <select class="form-select" required>
            <option value="">Select your branch</option>
            <option >Computer Science and Engineering</option>
            <option >Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Electrical Engineering</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Date of Birth</label>
        <input type="date" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="4" placeholder="Enter your address" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Upload Photo</label>
        <input type="file" class="form-control" accept="image/*" required>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" required>
        <label class="form-check-label">I agree to the terms and conditions</label>
    </div>
    <div class="text-center">
        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-danger">Reset</button>
    </div>
</form>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"> </script>  
</body>
</html>
