<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
     <div class="container">
        <div class="row">
           <p class="text-primary">hello bootstrap</p>
        </div>
     </div>
     <div class="container mt-5">
        <button class="btn btn-primary"
        data-bs-toggle="collapse"
        data-bs-target="#demo">Click me</button>
        <div class="collapse" id="demo">
            <p>This is a simple collapse element</p>
        </div>
     </div>
     <div class="container mt-6">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="border p-2 bg-success text-white">
                    colum1
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="border p-2 bg-primary text-white">
                    column2
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4" p-2 m-3>
                <div class="border p-2 bg-danger text-white">
                    column3
                </div>
            </div>
        </div>
     </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"> </script>
</body>
</html>
