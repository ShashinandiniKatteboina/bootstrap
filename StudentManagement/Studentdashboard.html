<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Student Dashboard</h1>
    </div>
    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Total Students</h5>
                    <h2 class="badge bg-primary">250</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Present Students</h5>
                    <h2 class="badge bg-success">220</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Absent Students</h5>
                    <h2 class="badge bg-danger">30</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Placements</h5>
                    <h2 class="badge bg-warning">180</h2>
                </div>
            </div>
        </div>
    </div>
    <div class="mb-3">
        <input type="text" class="form-control" placeholder="Search students...">
    </div>
    <div class="table-reponsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Attendance</th>
                </tr>
            </thead>
           
            <tbody>
                <tr>
                    <td>101</td>
                    <td>John Doe</td>
                    <td>Computer Science</td>
                    <td><span class="badge bg-success">Present</span></td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Rahul</td>
                     <td>ECE</td>
                    <td><span class="badge bg-danger">Absent</span></td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Priya</td>
                    <td>EEE</td>
                    <td><span class="badge bg-success">Present</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
