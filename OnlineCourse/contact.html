<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <section class="py-5">
        <div class="container">
            <h1 class="text-center">Contact Us</h1>
        </div>
    </section>

    <section class="pb-5">
        <div class="container">
            <div class="row g-4">

                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">

                            <h3 class="mb-3">Send Message</h3>

                            <form>

                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Message</label>
                                    <textarea class="form-control" rows="5" required></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    Send Message
                                </button>

                            </form>

                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">

                            <h3 class="mb-3">Location Map</h3>

                            <p>Map Location of CVR College of Engineering</p>

                            <div class="bg-light border d-flex justify-content-center align-items-center" style="height:300px;">
                                Google Map Placeholder
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <section class="pb-5">
        <div class="container">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h3>Address Information</h3>

                    <p>
                        <strong>College:</strong> CVR College of Engineering
                    </p>

                    <p>
                        <strong>Address:</strong> Vastunagar,
                        Mangalpalli, Ibrahimpatnam,
                        Hyderabad, Telangana.
                    </p>

                    <p>
                        <strong>Phone:</strong> +91 9876543210
                    </p>

                    <p>
                        <strong>Email:</strong> info@cvr.ac.in
                    </p>

                </div>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
