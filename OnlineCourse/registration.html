<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <section class="py-5">
        <div class="container">
            <h1 class="text-center mb-4">Student Registration</h1>
        </div>
    </section>
    <div class="container mb-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <form onsubmit="showMessage(event)">
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="tel" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" required>
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" required>
                        <label class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">Other</label>
                    </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Course Selection</label>
                        <select class="form-select" required>
                            <option value="" selected disabled>Select Course</option>
                            <option>Web Development</option>
                            <option>Python Programming</option>
                            <option>Data Science</option>
                            <option>AI & Machine Learning</option>
                            <option>Java Programming</option>
                            <option>Cloud Computing</option>
                        </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Qualification</label>
                            <input type="text" class="form-control" placeholder="enter qualification" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload Resume</label>
                            <input type="file" class="form-control" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">I agree to the terms and conditions</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    
                </form>
            </div>
            </div>
        </div>
    </div>
    <script>
        function showMessage(event) {
            event.preventDefault();
            alert("Registration successful!");
        }
        </script>
</body>
</html>
